[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-shift"
version = "0.1.0"
description = "Diagnosing and closing the Europe-to-Nepal performance gap in GI endoscopy (MSc thesis code)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
